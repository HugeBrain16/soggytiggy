<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soggytiggy - About</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="/styles/style.css" rel="stylesheet"> 
    <link href="/styles/gallery.css" rel="stylesheet">
    <link href="/styles/modal.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet"/>
    <script src="/assets/jquery.js"></script>
  </head>
  <body>
    <div class="content-background-image"></div>
    <h1 id="title" align="center">Soggytiggy</h1>
    <div class="animate__animated animate__fadeIn animate__faster content">
      <div class="content-header">
        <h1>Gallery</h1>
        <div class="content-navbar">
          <p class="content-navbar-item"><a href="/index.html">Home</a></p>
          <p class="content-navbar-item content-navbar-active">Gallery</p>
          <p class="content-navbar-item"><a href="/about.html">About</a></p>
        </div>
      </div>
      <div class="content-body">
        <p align="center">My commissions are open at <a class="content-button" href="https://soggytiggy-prices.carrd.co">soggytiggy.carrd.co</a>, if you're interested</p>
        <p id="gallery-sort-text">Sort by: <select id="gallery-sort">
          <option value="latest">Latest</option>
          <option value="oldest">Oldest</option>
        </select></p>
        <ul>
          <li><input type="checkbox" class="gallery-filter-toggle" filter="doodle"> Show doodles</li>
          <li><input type="checkbox" class="gallery-filter-toggle gallery-filter-unsafe" filter="gore"> Show gore</li>
          <li><input type="checkbox" class="gallery-filter-toggle gallery-filter-unsafe" filter="nsfw"> Show NSFW/Suggestive</li>
        </ul>
        <div align="center">
          <ul id="gallery-page">
            <li id="gallery-page-prev">Prev</li>
            <li id="gallery-page-pages"></li>
            <li id="gallery-page-next">Next</li>
          </ul>
        </div>
        <div class="gallery-content"></div>
      </div>
    </div>
    <p align="center" id="copyright"><small>@soggytiggy 2024 - 2025, managed by <a target="_blank" href="https://github.com/hugebrain16">@hugebrain16</a></small></p>
    <script src="/scripts/gallery.js"></script>
    <script>
      var SHOW_FILTERED_CONTENT = false;
      var filters = [];

      function clearFilters() {
        $(".gallery-filter-toggle").each(function() {
          this.checked = false;
        });
      }

      function clearUnsafeFilters() {
        $(".gallery-filter-unsafe").each(function() {
          this.checked = false;
        });
      }

      function applyFilter() {
        $(".gallery").each(function() {
          const image = $(this);

          if (image.attr("tags") !== undefined) {
            if (image.attr("tags").split(",").some(filter => filters.includes(filter)))
              image.css("display", "inline-grid");
            else
              image.css("display", "none");
          }
        });
      }

      loadPost(false, 0, false, true);
      clearFilters();

      $(".gallery-filter-toggle").on("change", function() {
        if ($(this).hasClass("gallery-filter-unsafe")) {
          if (!SHOW_FILTERED_CONTENT)
            if (confirm("The images may contain sensitive themes, suggestive themes, gore and nudity.\ndo you wish to proceed?"))
              SHOW_FILTERED_CONTENT = true;
            else
              return clearUnsafeFilters();
        }

        $(".gallery-filter-toggle").each(function() {
          const cFilter = $(this);

          if (cFilter.is(":checked"))
            filters.push(cFilter.attr("filter"));
          else
            filters = filters.filter(val => val !== cFilter.attr("filter"))
        });

        applyFilter();
      });
      
      postLoadPost = function() {
        applyFilter();
      };

      $("#gallery-sort").on("change", function() {
        if (this.value === "latest") {
          loadPost(false, 0, false, true);
        } else if (this.value === "oldest") {
          loadPost(true, 0, false, true);
        }
      });
    </script>
  </body>
</html>
