        { url: "https://file.garden/aOf31PFhxWt7Kbzd/Batlord/Website/Shelf/1500x500.jpg", type: "image" },
        { url: "https://file.garden/aOf31PFhxWt7Kbzd/Batlord/Website/Shelf/7e0a21ab72a143b4b42e6960d01d73d3~tplv-jj85edgx6n-image-origin.jpeg", type: "image" },
        { url: "https://file.garden/aOf31PFhxWt7Kbzd/Batlord/Website/Shelf/G-2rKndXMAAmSMu.jpg", type: "image" },
        { url: "https://file.garden/aOf31PFhxWt7Kbzd/Batlord/Website/Shelf/G6TAA5uW4AAI7f4.jpg", type: "image" },

        { url: "https://file.garden/aOf31PFhxWt7Kbzd/Batlord/Website/Shelf/Popsikkaat_%20Stuff%20Mart%20-sviitti.mp4", type: "video" },
        { url: "https://file.garden/aOf31PFhxWt7Kbzd/Batlord/Website/Shelf/goylivesmatter.mp4", type: "video" },

        { url: "https://file.garden/aOf31PFhxWt7Kbzd/Batlord/Website/Shelf/dq7dMlLPnCnOY2ES.mp4", type: "video"},
        { url: "https://file.garden/aOf31PFhxWt7Kbzd/Batlord/Website/Shelf/1779988484047518.webm", type: "video" },
        { url: "https://file.garden/aOf31PFhxWt7Kbzd/Batlord/Website/Shelf/1757896412975161.webm", type: "video" },
        { url: "https://file.garden/aOf31PFhxWt7Kbzd/Batlord/Website/Shelf/coal.mp4", type: "video" },

        { url: "https://file.garden/aOf31PFhxWt7Kbzd/Batlord/Website/Shelf/ai%20gaming.mp4", type: "video" },
        { url: "https://file.garden/aOf31PFhxWt7Kbzd/Batlord/Website/Shelf/ze%20new%20world%20ordah.mp4", type: "video" },
      ];

      $(document).ready(function() {
        images.forEach(function(image) {
          var el = '<div class="grid-item">';
          if (image.type === "video")
            el += `<video src="${image.url}"></video>`;
          else if (image.type === "image")
            el += `<img src="${image.url}">`;
          el += `<p class="grid-item-text">${image.text ? image.text : ""}</p></div>`;
          $("#images").append(el);
        });

        $('.grid').masonry({
          itemSelector: '.grid-item',
          columnWidth: 0,
          transitionDuration: 0,
        });

        $(".grid-item").on("click", function() {
          var prevClick = $("#images").find(".grid-active");

          var prevVid = prevClick.find("video");
          if (prevVid.length) {
            prevVid.attr("controls", false);
            prevVid[0].pause();
            prevVid[0].currentTime = 0;
          }

          prevClick.removeClass("grid-active");
          $(this).addClass("grid-active");

          var vid = $(this).find("video");
          if (vid.length) {
            vid.attr("controls", true);
            vid[0].play();
            vid[0].muted = true;
          }

          if (prevClick.is(this)) {
            $(this).removeClass("grid-active");

            if (vid.length) {
              vid.attr("controls", false);
              vid[0].pause();
              vid[0].currentTime = 0;
            }
          }
        });
    });
    </script>
  </body>
</html>
